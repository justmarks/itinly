name: Release Tag

# Tags the commit when a `feat: release vX.Y.Z` lands on main.
#
# Versioning policy (2026-05, see RELEASING.md):
#   - Versions are bumped manually inside the release PR, NOT
#     automatically by this workflow. The PR title is `feat: release
#     vX.Y.Z` and the same PR pre-bumps `package.json` +
#     `apps/web/package.json`.
#   - Why: the previous auto-bump workflow created a follow-up
#     `chore: bump version ...` commit AFTER the release squash-merge.
#     Vercel's `ignoreCommand` skipped that commit, so production
#     deployed the release content with the *old* package.json
#     version embedded in `NEXT_PUBLIC_APP_VERSION`. Folding the bump
#     into the release PR means Vercel deploys a single squash commit
#     that already carries the right version.
#
# This workflow's only job now is to push a `vX.Y.Z` git tag so the
# "All releases on GitHub" link in the release-notes footer keeps
# working. The tag is derived from the commit subject, which is
# expected to match `^feat: release v(\d+\.\d+\.\d+)`.

on:
  push:
    branches: [main]

jobs:
  tag:
    runs-on: ubuntu-latest
    if: "startsWith(github.event.head_commit.message, 'feat: release v')"

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Extract version from commit subject
        id: version
        # Subject pattern: `feat: release vX.Y.Z` or `feat: release
        # vX.Y.Z (#NNN)` (squash-merge from a PR). Read the version
        # back out and tag the commit. Pass the message via env so
        # parens / quotes in the subject don't crash bash.
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          VERSION=$(echo "$COMMIT_MSG" | head -1 | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not extract version from commit subject: $COMMIT_MSG"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Verify package.json matches release version
        # Sanity check: the squash commit should have already bumped
        # package.json to match the version in the subject. If not,
        # fail loudly so we don't tag a release whose in-app version
        # disagrees with its tag.
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          EXPECTED="${{ steps.version.outputs.version }}"
          if [ "v$PKG_VERSION" != "$EXPECTED" ]; then
            echo "::error::package.json version ($PKG_VERSION) doesn't match release tag ($EXPECTED). Update package.json + apps/web/package.json in the release PR before merging."
            exit 1
          fi

      - name: Push tag
        run: |
          TAG="${{ steps.version.outputs.version }}"
          # Don't fail if the tag already exists (e.g. workflow re-run
          # on the same commit). Just skip the push.
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; skipping."
            exit 0
          fi
          git tag "$TAG"
          git push origin "$TAG"
